<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: dark black to very dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <!-- Icon fill gradient: matches existing logo colors -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="35%" stop-color="#e50914"/>
      <stop offset="70%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" ry="106"
        fill="none" stroke="rgba(229,9,20,0.12)" stroke-width="2"/>

  <!-- Outer ring -->
  <rect x="80" y="80" width="352" height="352" rx="70" ry="70"
        fill="none" stroke="url(#iconGrad)" stroke-width="14" opacity="0.25"/>

  <!-- Middle ring -->
  <rect x="112" y="112" width="288" height="288" rx="55" ry="55"
        fill="none" stroke="url(#iconGrad)" stroke-width="10" opacity="0.45"/>

  <!-- Inner filled rounded square -->
  <rect x="148" y="148" width="216" height="216" rx="40" ry="40"
        fill="url(#iconGrad)" opacity="0.95" filter="url(#glow)"/>

  <!-- Play triangle — white, centered -->
  <polygon
    points="220,196 220,316 320,256"
    fill="#ffffff"
    opacity="0.95"
  />
</svg>
